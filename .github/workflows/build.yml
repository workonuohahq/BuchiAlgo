name: BuchiAlgo CI Build

on:
  push:
    branches:
      - hardening/vercel-production
  pull_request:
    branches:
      - hardening/vercel-production

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
